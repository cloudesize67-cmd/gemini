name: NOESIS Deploy

on:
  push:
    branches:
      - claude/aegis-cognitive-framework-ic5Jo
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax check agents
        run: |
          python -m py_compile agents/supervisor.py
          python -m py_compile agents/argus.py
          python -m py_compile agents/arbiter.py
          python -m py_compile agents/logos.py
          python -m py_compile agents/daedalus.py
          python -m py_compile pipeline.py
          python -m py_compile server.py
          echo "All syntax checks passed"

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/claude/aegis-cognitive-framework-ic5Jo' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service noesis-api
          echo "Deployed to Railway"

      - name: Verify deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          RAILWAY_URL=$(railway status --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))")
          echo "RAILWAY_URL=$RAILWAY_URL" >> $GITHUB_ENV
          
          # Health check
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RAILWAY_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed: $RAILWAY_URL/health"
              break
            fi
            echo "Attempt $i: status=$STATUS, waiting..."
            sleep 10
          done

      - name: Post deployment summary
        run: |
          echo "## NOESIS Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Agents:** SUPERVISOR (Opus 4.5) + ARGUS + ARBITER + LOGOS + DAEDALUS" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $RAILWAY_URL" >> $GITHUB_STEP_SUMMARY
